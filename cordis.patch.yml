# dsh-usage-stats bundle patch: one host row over the web profile.
# The row name resolves from the profile's node_modules, where
# `dsh plugin --profile <name> add ...` installed this package. The
# package's `dsh.client` declaration registers the web half — the
# Settings page "消耗统计" served at /plugins/dsh-usage-stats/client.js.
- insert:
    - id: usage-stats
      name: dsh-usage-stats
